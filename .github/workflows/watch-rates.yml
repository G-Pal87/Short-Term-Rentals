name: Watch for Rate Updates

# Polls the Business-Tracking rate feed and redeploys the site when it has
# changed since the live build. Compares with the rates-stamp.txt the live site
# was built with (see deploy.yml), so nothing is committed to this repo.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write   # to start deploy.yml
  contents: read

env:
  SITE_URL: https://g-pal87.github.io/Short-Term-Rentals
  RATES_INDEX_URL: https://raw.githubusercontent.com/G-Pal87/Business-Tracking/rates-feed/exports/daily-rates/index.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Business-Tracking rates have changed
        id: check
        run: |
          LATEST=$(curl -sf "$RATES_INDEX_URL?t=$(date +%s)" | python3 -c "import json,sys; print(json.load(sys.stdin).get('generatedAt',''))" 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "Could not fetch feed - skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LIVE=$(curl -sf "$SITE_URL/rates-stamp.txt?t=$(date +%s)" | tr -d '[:space:]' || echo "")

          if [ "$LATEST" = "$LIVE" ]; then
            echo "Rates unchanged ($LATEST) - no rebuild needed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Rates changed: live=${LIVE:-none} feed=$LATEST"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A deploy already queued or running will pick up the new feed (or
          # the next check will notice it didn't) - don't stack another.
          busy=$(gh run list -R "$GITHUB_REPOSITORY" --workflow deploy.yml --limit 20 --json status \
            -q '[.[] | select(.status != "completed")] | length')
          if [ "${busy:-0}" -gt 0 ]; then
            echo "A deploy is already queued/running - skipping"
            exit 0
          fi
          gh workflow run deploy.yml -R "$GITHUB_REPOSITORY" --ref main
